coverage:
  status:
    project:
      default:
        # Absolute floor: the combined report must stay at/above 99.9%, so
        # coverage cannot silently degrade between PRs.
        target: 99.9%
        threshold: 0%
    patch:
      default:
        # New/changed lines must be essentially fully covered too.
        target: 99.9%
        threshold: 0%

name: Check Base Branch

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  check-base-branch:
    name: Validate Base Branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Ensure PR targets allowed base branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"

          # Allow temp-to-temp branch flows (neither base nor head are main/develop)
          if [ "$BASE" != "main" ] && [ "$BASE" != "develop" ] && [ "$HEAD" != "main" ] && [ "$HEAD" != "develop" ]; then
            echo "Base branch check passed: allowing temporary branch flow from '$HEAD' to '$BASE'."
            exit 0
          fi

          if [ "$BASE" = "develop" ]; then
            echo "Base branch check passed: targeting 'develop'."
            exit 0
          fi

          if [ "$BASE" = "main" ] && [ "$HEAD" = "develop" ]; then
            echo "Base branch check passed: allowing release PR from 'develop' to 'main'."
            exit 0
          fi

          if [ "$BASE" = "main" ] && [[ "$HEAD" == docs/whats-new-* ]]; then
            echo "Base branch check passed: allowing automated What's New PR from '$HEAD' to 'main'."
            exit 0
          fi

          if [ "$BASE" = "main" ]; then
            # Check if all changed files are CI/CD or agentic config files
            PR_NUMBER=$(jq --raw-output '.pull_request.number // empty' "$GITHUB_EVENT_PATH")
            CHANGED_FILES=$(gh pr diff "$PR_NUMBER" --name-only 2>/dev/null || echo "")
            if [ -n "$CHANGED_FILES" ]; then
              NON_CICD_FILES=$(echo "$CHANGED_FILES" | grep -v -E "^(.github/|AGENTS\.md$|pyproject\.toml$|opencode\.json$|opencode\.yaml$|\.opencode/|\.releaserc)" || true)
              if [ -z "$NON_CICD_FILES" ]; then
                echo "Base branch check passed: all changed files are CI/CD or agentic config"
                exit 0
              fi
            fi
          fi

          if [ "$BASE" = "main" ]; then
            echo "Error: Pull requests targeting 'main' must come from the 'develop' branch, not '$HEAD'."
            exit 1
          fi

          echo "Error: Pull requests must target 'develop' (or target 'main' only from 'develop'), not '$BASE'."
          exit 1
name: Check Base Branch

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  check-base-branch:
    name: Validate Base Branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR targets develop
        run: |
          if [ "${{ github.base_ref }}" != "develop" ]; then
            echo "Error: Pull requests must target the 'develop' branch, not '${{ github.base_ref }}'."
            exit 1
          fi
          echo "Base branch check passed: targeting 'develop'."

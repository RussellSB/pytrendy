name: Docs Preview
# Builds and temporarily deploys a docs preview for every PR that touches
# docs-related files.  A comment is posted on the PR with the preview URL.
# The preview is removed automatically when the PR is closed.
#
# NOTE: This workflow requires the same GitHub Pages setup as docs.yaml:
#   Settings → Pages → Build and deployment → Source → Deploy from a branch
#   Branch: gh-pages  /  Folder: / (root)
#
# Fork PRs are skipped because they cannot push to the gh-pages branch.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pytrendy/**'

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Build & Deploy Docs Preview (PR #${{ github.event.pull_request.number }})
    # Skip when the PR is closed, and skip fork PRs (no write access)
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Normalise notebooks
        run: |
          chmod +x scripts/normalize_notebooks.sh
          bash scripts/normalize_notebooks.sh

      - name: Configure mkdocs for preview
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          SITE_URL="https://russellsb.github.io/pytrendy/pr-$PR_NUMBER/"
          echo "Deploying docs preview to: $SITE_URL"

          # Remove offline plugin — not required for an online GitHub Pages deployment
          sed -i '/^  - offline$/d' mkdocs.yml

          # Inject site_url so MkDocs generates correct absolute asset paths for
          # the /pr-N/ subdirectory.
          echo "site_url: $SITE_URL" >> mkdocs.yml

      - name: Build docs
        run: mkdocs build --site-dir site/

      - name: Prepare deployment directory
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          mkdir -p deploy_dir/"pr-$PR_NUMBER"
          cp -r site/* deploy_dir/"pr-$PR_NUMBER"/

      - name: Deploy preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy_dir
          # keep_files preserves all other deployed subdirectories (main/, develop/, other PRs)
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "ci(docs): deploy pr preview for #${{ github.event.pull_request.number }} at ${{ github.sha }}"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://russellsb.github.io/pytrendy/pr-${prNumber}/`;
            // Stable marker used to locate the bot comment regardless of its current body text
            const MARKER = '<!-- docs-preview-bot -->';
            const body = [
              MARKER,
              `📚 **Docs preview deployed!**`,
              ``,
              `Your docs preview is available at: ${previewUrl}`,
              ``,
              `> This preview will be removed when the PR is closed.`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            // Update the existing bot comment instead of creating a duplicate
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    name: Cleanup Docs Preview (PR #${{ github.event.pull_request.number }})
    # Only run on PR close, and skip fork PRs (no write access)
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove PR preview directory
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -d "pr-$PR_NUMBER" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "pr-$PR_NUMBER"
            git commit -m "ci(docs): remove pr preview for #$PR_NUMBER"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          else
            echo "No preview found for PR #$PR_NUMBER, skipping cleanup"
          fi

      - name: Update PR comment on cleanup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            // Stable marker used to locate the bot comment regardless of its current body text
            const MARKER = '<!-- docs-preview-bot -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(MARKER)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: `${MARKER}\n📚 **Docs preview removed**\n\nThe docs preview for this PR has been cleaned up.`,
              });
            }

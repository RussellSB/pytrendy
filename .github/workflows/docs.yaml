name: Docs
# NOTE: Before this workflow can serve GitHub Pages, you must enable Pages in
# the repository settings:
#   Settings → Pages → Build and deployment → Source → Deploy from a branch
#   Branch: gh-pages  /  Folder: / (root)
# This is a one-time manual step. After that, every successful run of
# deploy-docs will automatically update the published site.

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  check-should-deploy:
    name: Check if docs should be deployed
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine if docs deployment is needed
        id: check
        run: |
          EVENT_PATH="${GITHUB_EVENT_PATH}"
          if [ -z "$EVENT_PATH" ] || [ ! -f "$EVENT_PATH" ]; then
            echo "Event payload not found; defaulting to deploy docs"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Aggregate all commit messages from the push event (subject + body)
          COMMIT_MESSAGES=$(jq -r '.commits[]?.message' "$EVENT_PATH")
          echo "Commit messages in push:"
          echo "$COMMIT_MESSAGES"

          # Skip if any commit explicitly flags docs to be skipped
          if echo "$COMMIT_MESSAGES" | grep -q '\[skip docs\]'; then
            echo "Skipping: [skip docs] flag found in at least one commit"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Always deploy for semantic commit types that affect code or content:
          # feat (minor/major), fix (patch), docs, refactor, perf
          if echo "$COMMIT_MESSAGES" | grep -qE '^(feat|fix|docs|refactor|perf)(\([^)]*\))?!?:'; then
            echo "Deploying: matched semantic commit type in at least one commit"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Breaking changes (major version bump) — e.g. feat!: or type(scope)!:
          if echo "$COMMIT_MESSAGES" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            echo "Deploying: breaking change in commit subject"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Breaking change declared in any commit body
          if echo "$COMMIT_MESSAGES" | grep -q 'BREAKING CHANGE'; then
            echo "Deploying: BREAKING CHANGE found in commit body"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine the diff range for the entire push
          BEFORE_SHA=$(jq -r '.before' "$EVENT_PATH")
          HEAD_SHA="${GITHUB_SHA}"

          if [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$'; then
            echo "Using diff range: $BEFORE_SHA..$HEAD_SHA"
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" 2>/dev/null || echo "")
          else
            echo "No valid 'before' SHA in event; falling back to HEAD~1..HEAD"
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Changed files across push: $CHANGED"
          if echo "$CHANGED" | grep -qE '^(docs/|mkdocs\.yml|pytrendy/)'; then
            echo "Deploying: relevant files changed"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Skipping: no relevant changes detected"
          echo "should_deploy=false" >> "$GITHUB_OUTPUT"

  deploy-docs:
    name: Build & Deploy Docs (${{ github.ref_name }})
    needs: check-should-deploy
    if: needs.check-should-deploy.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Normalise notebooks
        run: |
          chmod +x scripts/normalize_notebooks.sh
          bash scripts/normalize_notebooks.sh

      - name: Configure mkdocs for deployment
        run: |
          BRANCH="${{ github.ref_name }}"
          SITE_URL="https://russellsb.github.io/pytrendy/$BRANCH/"
          echo "Deploying docs to: $SITE_URL"

          # Remove offline plugin — not required for an online GitHub Pages deployment
          sed -i '/^  - offline$/d' mkdocs.yml

          # Inject site_url so MkDocs generates correct absolute asset paths for
          # the /branch/ subdirectory. mkdocs.yml has no existing site_url, so
          # appending a single key is clean YAML.
          echo "site_url: $SITE_URL" >> mkdocs.yml

      - name: Build docs
        run: mkdocs build --site-dir site/

      - name: Prepare deployment directory
        run: |
          BRANCH="${{ github.ref_name }}"
          mkdir -p deploy_dir/"$BRANCH"
          cp -r site/* deploy_dir/"$BRANCH"/

          # When publishing from main, also write a root redirect so that
          # russellsb.github.io/pytrendy/ forwards visitors to the stable docs.
          if [ "$BRANCH" = "main" ]; then
            cat > deploy_dir/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=main/">
            <link rel="canonical" href="main/">
            <title>PyTrendy Documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="main/">stable docs</a>…</p>
          </body>
          </html>
          EOF
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy_dir
          # keep_files ensures the other branch's subdirectory is not wiped
          # e.g. deploying develop/ leaves main/ intact, and vice-versa.
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "ci(docs): deploy ${{ github.ref_name }} @ ${{ github.sha }}"

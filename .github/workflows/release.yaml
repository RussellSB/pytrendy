name: Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force PyPI publish even if semantic-release did not release'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  test-core:
    name: Run Core Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run core tests
        run: |
          pytest tests/ -v -m core

  semantic-release:
    name: Semantic Release
    needs: test-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GH_TOKEN should be a PAT with the repo scope (or contents:write
          # plus branch-protection bypass) so semantic-release can push the
          # changelog commit back to the protected release branch. Falls back
          # to GITHUB_TOKEN, which cannot push to a protected branch — the
          # commit will be skipped and a warning will be issued.
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Use dev release config
        if: github.ref_name == 'develop'
        run: cp .releaserc.dev.json .releaserc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release plugins
        run: npm install -g semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/github @semantic-release/exec conventional-changelog-conventionalcommits

      - name: Run semantic-release
        id: release
        env:
          # Use GH_TOKEN (PAT with repo scope and branch-protection bypass)
          # when available. GITHUB_TOKEN is used as a fallback, but it cannot
          # push to a protected branch, so @semantic-release/git will fail and
          # the changelog commit will be skipped (handled below).
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set +e
          OUTPUT=$(npx semantic-release 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "The next release version is"; then
            echo "released=true" >> $GITHUB_OUTPUT
            VERSION=$(echo "$OUTPUT" | grep -oP 'The next release version is \K[0-9a-zA-Z.\-]+')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::warning::semantic-release exited with code $EXIT_CODE."
              echo "::warning::This is likely because GITHUB_TOKEN cannot push to the protected '${{ github.ref_name }}' branch."
              echo "::warning::The release and PyPI publish will still proceed. To also commit the changelog back to the branch, create a GH_TOKEN repository secret set to a PAT with the repo scope and branch-protection bypass for the '${{ github.ref_name }}' branch."
            fi
          else
            echo "released=false" >> $GITHUB_OUTPUT
            if [ $EXIT_CODE -ne 0 ]; then
              exit $EXIT_CODE
            fi
          fi

  build-and-publish:
    name: Build & Publish to PyPI
    needs: semantic-release
    if: |
      needs.semantic-release.outputs.released == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish == 'true')
    runs-on: ubuntu-latest
    environment: release 
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set package version
        run: |
          VERSION="${{ needs.semantic-release.outputs.version }}"
          PEP440_VERSION=$(echo "$VERSION" | sed 's/-dev\./.dev/')
          echo "Setting version to $PEP440_VERSION"
          poetry version "$PEP440_VERSION"

      - name: Install dependencies & build package
        run: |
          poetry install --no-interaction --sync
          poetry build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          package-dir: dist/

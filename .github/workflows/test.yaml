name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          ruff check .
      
      - name: Run core tests with coverage
        run: |
          pytest tests/ -v -m core
      
      - name: Run non-core tests with coverage (append mode)
        run: |
          # Check if there are any non-core tests to run (exit code 5 means no tests collected)
          set +e
          # Important: disable coverage for collection probe so it does not reset .coverage.
          pytest tests/ --collect-only -q -m "not core" --no-cov > /dev/null 2>&1
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then
            echo "No non-core tests found, skipping..."
          else
            pytest tests/ -v -m "not core" --cov-append
          fi
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-pytrendy
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

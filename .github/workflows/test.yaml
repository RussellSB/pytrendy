name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      
      - name: Run core tests
        run: |
          pytest tests/ -v -m core
      
      - name: Run non-core tests
        run: |
          # Check if there are any non-core tests to run (exit code 5 means no tests collected)
          set +e
          pytest tests/ --collect-only -q -m "not core" > /dev/null 2>&1
          exit_code=$?
          set -e
          if [ $exit_code -eq 5 ]; then
            echo "No non-core tests found, skipping..."
          else
            pytest tests/ -v -m "not core"
          fi

name: What's New Generator

# Triggers
# ─────────────────────────────────────────────────────────────────────────────
# 1. Automatically, whenever a GitHub Release is published (covers both stable
#    releases from main and pre-releases from develop via semantic-release).
# 2. Manually via workflow_dispatch for ad-hoc regeneration.
#
# Flow
# ─────────────────────────────────────────────────────────────────────────────
# • Parse the release notes (or fall back to CHANGELOG.md).
# • Call the GitHub Models API (Claude Sonnet 4) to generate a user-friendly entry.
# • Prepend the new entry into docs/whats-new.md.
# • Open a PR back to the release branch (develop or main) for review.
# • On main: also open a follow-up PR to sync the page back to develop.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to generate entry for (e.g. v1.2.0)'
        required: false
        default: ''
      target_branch:
        description: 'Branch to open the PR against'
        required: false
        default: 'develop'

jobs:
  generate-whats-new:
    name: Generate What's New entry
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # ── 1. Resolve metadata ─────────────────────────────────────────────────
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}"               >> "$GITHUB_OUTPUT"
            echo "name=${{ github.event.release.name }}"                  >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.release.prerelease }}"      >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.release.target_commitish }}"    >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.inputs.tag }}"
            BRANCH="${{ github.event.inputs.target_branch }}"
            echo "tag=${TAG:-HEAD}"                                        >> "$GITHUB_OUTPUT"
            echo "name=Manual dispatch"                                    >> "$GITHUB_OUTPUT"
            # Treat as pre-release when targeting develop
            if [ "${BRANCH}" = "main" ]; then
              echo "prerelease=false"                                      >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true"                                       >> "$GITHUB_OUTPUT"
            fi
            echo "branch=${BRANCH:-develop}"                              >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Checkout the release branch ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.branch }}
          fetch-depth: 0

      # ── 3. Setup Python ─────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 4. Run the agentic generator ────────────────────────────────────────
      - name: Generate What's New entry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: python scripts/generate_whats_new.py

      # ── 5. Open a PR ────────────────────────────────────────────────────────
      - name: Create Pull Request to release branch
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(whats-new): add entry for ${{ steps.meta.outputs.tag }} [skip ci]"
          branch: "docs/whats-new-${{ steps.meta.outputs.tag }}"
          base: ${{ steps.meta.outputs.branch }}
          title: "docs(whats-new): add what's new entry for ${{ steps.meta.outputs.tag }}"
          body: |
            ## 📚 Automated What's New update

            This PR was generated automatically by the **What's New Generator** workflow
            after the `${{ steps.meta.outputs.tag }}` release was published.

            ### What changed
            - A new entry was prepended to `docs/whats-new.md` using the GitHub Models API
              (`claude-sonnet-4`) to summarise the release notes in a user-friendly way.

            ### Review checklist
            - [ ] The generated content is accurate and user-friendly.
            - [ ] Code examples (if any) are correct.
            - [ ] No sensitive information was accidentally included.

            > **Auto-generated** · [What's New Generator workflow](../actions/workflows/whats-new.yaml)
          labels: "documentation,automated"
          delete-branch: true

      - name: Print PR URL
        if: steps.pr.outputs.pull-request-url != ''
        run: echo "PR created → ${{ steps.pr.outputs.pull-request-url }}"

  # ── Sync back to develop when a stable release lands on main ─────────────
  sync-to-develop:
    name: Sync What's New back to develop
    needs: generate-whats-new
    # Only relevant when a stable release is published from main
    if: |
      github.event_name == 'release' &&
      github.event.release.prerelease == false &&
      github.event.release.target_commitish == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-generate What's New for develop (reframe as stable)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          IS_PRERELEASE: "false"
          BRANCH: develop
        run: python scripts/generate_whats_new.py

      - name: Create sync PR to develop
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(whats-new): sync stable entry for ${{ github.event.release.tag_name }} to develop [skip ci]"
          branch: "docs/whats-new-sync-${{ github.event.release.tag_name }}"
          base: develop
          title: "docs(whats-new): sync what's new entry for ${{ github.event.release.tag_name }} to develop"
          body: |
            ## 🔄 Automated What's New sync

            This PR was generated automatically to keep the `develop` branch in sync
            with the stable `${{ github.event.release.tag_name }}` release notes that were
            already merged to `main`.

            > **Auto-generated** · [What's New Generator workflow](../actions/workflows/whats-new.yaml)
          labels: "documentation,automated"
          delete-branch: true

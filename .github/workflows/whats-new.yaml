name: What's New Generator

# Triggers
# ─────────────────────────────────────────────────────────────────────────────
# 1. Automatically after the Release workflow completes on main/develop.
# 2. Manually via workflow_dispatch for ad-hoc regeneration.
#
# Flow
# ─────────────────────────────────────────────────────────────────────────────
# • Resolve release metadata from the most recent release matching the branch.
# • Parse release notes (or fall back to CHANGELOG.md).
# • Call the GitHub Models API (Claude Sonnet 4.6) to generate a user-friendly entry.
# • Prepend the new entry into docs/whats-new.md.
# • Open a PR back to the release branch (develop or main) for review.
# • On main: also open a follow-up PR to sync the page back to develop.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to generate entry for (e.g. v1.2.0)'
        required: false
        default: ''
      target_branch:
        description: 'Branch to open the PR against'
        required: false
        default: 'develop'

env:
  RELEASE_FETCH_PAGE_SIZE: "30"

jobs:
  generate-whats-new:
    name: Generate What's New entry
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.meta.outputs.skip }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get latest release
        id: get_release
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        env:
          RELEASE_PAGE_SIZE: ${{ env.RELEASE_FETCH_PAGE_SIZE }}
        with:
          script: |
            const releasePageSize = Number(process.env.RELEASE_PAGE_SIZE);
            const headBranch = context.payload.workflow_run.head_branch;
            const runStartedAt = new Date(context.payload.workflow_run.run_started_at);

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: releasePageSize,
            });

            // Pick the most-recent non-draft release on this branch.
            // listReleases returns results sorted newest-first, so the first
            // matching entry is always the release that just completed.
            const match = releases.find((release) => {
              if (release.draft) return false;
              if (release.target_commitish !== headBranch) return false;
              if (!release.published_at) return false;
              return true;
            });

            // Guard: skip if no release was found, or if the release was not published
            // after this workflow run started (meaning the Release workflow completed
            // with no new release).
            if (!match || new Date(match.published_at) <= runStartedAt) {
              core.setOutput("skip", "true");
              core.setOutput("branch", headBranch);
              return;
            }

            core.setOutput("skip", "false");
            core.setOutput("tag", match.tag_name);
            core.setOutput("name", match.name || match.tag_name);
            core.setOutput("body", match.body || "");
            core.setOutput("prerelease", String(match.prerelease));
            core.setOutput("branch", headBranch);

      # ── 1. Resolve metadata ─────────────────────────────────────────────────
      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "skip=${{ steps.get_release.outputs.skip }}"                >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.get_release.outputs.tag }}"                  >> "$GITHUB_OUTPUT"
            echo "name=${{ steps.get_release.outputs.name }}"                >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ steps.get_release.outputs.prerelease }}"    >> "$GITHUB_OUTPUT"
            echo "branch=${{ steps.get_release.outputs.branch }}"            >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.inputs.tag }}"
            BRANCH="${{ github.event.inputs.target_branch }}"
            echo "skip=false"                                                >> "$GITHUB_OUTPUT"
            echo "tag=${TAG:-HEAD}"                                          >> "$GITHUB_OUTPUT"
            echo "name=Manual dispatch"                                      >> "$GITHUB_OUTPUT"
            # Treat as pre-release when targeting develop
            if [ "${BRANCH}" = "main" ]; then
              echo "prerelease=false"                                        >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true"                                         >> "$GITHUB_OUTPUT"
            fi
            echo "branch=${BRANCH:-develop}"                                 >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Checkout the release branch ──────────────────────────────────────
      - name: Checkout
        if: steps.meta.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.branch }}
          fetch-depth: 0

      # ── 3. Setup Python ─────────────────────────────────────────────────────
      - name: Setup Python
        if: steps.meta.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 4. Run the agentic generator ────────────────────────────────────────
      - name: Generate What's New entry
        if: steps.meta.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_BODY: ${{ steps.get_release.outputs.body }}
          IS_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          BRANCH: ${{ steps.meta.outputs.branch }}
        run: python scripts/generate_whats_new.py

      # ── 5. Open a PR ────────────────────────────────────────────────────────
      - name: Create Pull Request to release branch
        id: pr
        if: steps.meta.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(whats-new): add entry for ${{ steps.meta.outputs.tag }} [skip ci]"
          branch: "docs/whats-new-${{ steps.meta.outputs.tag }}"
          base: ${{ steps.meta.outputs.branch }}
          title: "docs(whats-new): add what's new entry for ${{ steps.meta.outputs.tag }}"
          body: |
            ## 📚 Automated What's New update

            This PR was generated automatically by the **What's New Generator** workflow
            after the `${{ steps.meta.outputs.tag }}` release was published.

            ### What changed
            - A new entry was prepended to `docs/whats-new.md` using the GitHub Models API
              (`claude-sonnet-4.6`) to summarise the release notes in a user-friendly way.

            ### Review checklist
            - [ ] The generated content is accurate and user-friendly.
            - [ ] Code examples (if any) are correct.
            - [ ] No sensitive information was accidentally included.

            > **Auto-generated** · [What's New Generator workflow](../actions/workflows/whats-new.yaml)
          labels: "documentation,automated"
          delete-branch: true

      - name: Print PR URL
        if: steps.meta.outputs.skip != 'true' && steps.pr.outputs.pull-request-url != ''
        run: echo "PR created → ${{ steps.pr.outputs.pull-request-url }}"

  # ── Sync back to develop when a stable release lands on main ─────────────
  sync-to-develop:
    name: Sync What's New back to develop
    needs: generate-whats-new
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      needs.generate-whats-new.outputs.skip != 'true' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Get latest stable release
        id: get_stable_release
        uses: actions/github-script@v7
        env:
          RELEASE_PAGE_SIZE: ${{ env.RELEASE_FETCH_PAGE_SIZE }}
        with:
          script: |
            const releasePageSize = Number(process.env.RELEASE_PAGE_SIZE);
            const runStartedAt = new Date(context.payload.workflow_run.run_started_at);

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: releasePageSize,
            });

            // Pick the most-recent non-draft stable release on main.
            // listReleases returns results sorted newest-first.
            const stable = releases.find((release) => {
              if (release.draft || release.prerelease) return false;
              if (release.target_commitish !== "main") return false;
              if (!release.published_at) return false;
              return true;
            });

            // Guard: skip if no stable release was found, or if it was not published
            // after this workflow run started (meaning the Release workflow completed
            // with no new stable release).
            if (!stable || new Date(stable.published_at) <= runStartedAt) {
              core.setOutput("skip", "true");
              return;
            }

            core.setOutput("skip", "false");
            core.setOutput("tag", stable.tag_name);
            core.setOutput("name", stable.name || stable.tag_name);
            core.setOutput("body", stable.body || "");

      - name: Checkout develop
        if: steps.get_stable_release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Python
        if: steps.get_stable_release.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-generate What's New for develop (reframe as stable)
        if: steps.get_stable_release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.get_stable_release.outputs.tag }}
          RELEASE_NAME: ${{ steps.get_stable_release.outputs.name }}
          RELEASE_BODY: ${{ steps.get_stable_release.outputs.body }}
          IS_PRERELEASE: "false"
          BRANCH: develop
        run: python scripts/generate_whats_new.py

      - name: Create sync PR to develop
        if: steps.get_stable_release.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(whats-new): sync stable entry for ${{ steps.get_stable_release.outputs.tag }} to develop [skip ci]"
          branch: "docs/whats-new-sync-${{ steps.get_stable_release.outputs.tag }}"
          base: develop
          title: "docs(whats-new): sync what's new entry for ${{ steps.get_stable_release.outputs.tag }} to develop"
          body: |
            ## 🔄 Automated What's New sync

            This PR was generated automatically to keep the `develop` branch in sync
            with the stable `${{ steps.get_stable_release.outputs.tag }}` release notes that were
            already merged to `main`.

            > **Auto-generated** · [What's New Generator workflow](../actions/workflows/whats-new.yaml)
          labels: "documentation,automated"
          delete-branch: true
